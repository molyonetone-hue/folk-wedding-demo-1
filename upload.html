<body class="up-page">

<!-- =========================================================
     GUEST PHOTO UPLOAD — opened from the QR code / Share Photos.
     All text comes from js/config.js; sending is handled by js/upload.js.
     ========================================================= -->
<header class="up-top">
  <a class="topbar__mark" href="index.html#memories"><span class="topbar__mono" data-config="couple.monogram">A · T</span></a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" class="lang__btn" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" class="lang__btn lang__btn--ta" data-lang="ta" aria-pressed="false" lang="ta">தமிழ்</button>
  </div>
</header>

<main class="up-main">
  <div class="up-card">
    <svg class="up-arch" viewBox="0 0 120 150" aria-hidden="true">
      <path d="M10 150 V70 Q10 22 60 8 Q110 22 110 70 V150" fill="none" stroke="currentColor" stroke-width="1"/>

    </svg>
    <p class="up-names"><span data-couple="partner1">Arwind</span> <em>&amp;</em> <span data-couple="partner2">Thivya</span></p>
    <h1 class="up-title" data-i18n="uploadTitle">Share your photos</h1>

    <!-- The upload form is built here by js/upload.js -->
    <div data-uploader></div>

    <a class="up-back" href="index.html#memories" data-i18n="backToSite">Back to the wedding website</a>
  </div>
  <p class="footer__credit up-credit"><span data-i18n="madeBy">Thoughtfully designed by</span> <a id="studio-link" href="https://onetone.my" target="_blank" rel="noopener">Onetone Studio</a></p>
</main>

<noscript><p class="up-noscript">Please enable JavaScript to upload photos.</p></noscript>

<script src="js/config.js" defer></script>

</html>
